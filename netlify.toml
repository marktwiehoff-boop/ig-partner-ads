[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Tägliches Abholen der Meta-Kennzahlen, 05:15 UTC (07:15 Uhr Sommerzeit).
[functions."kennzahlen-taeglich"]
  schedule = "15 5 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
